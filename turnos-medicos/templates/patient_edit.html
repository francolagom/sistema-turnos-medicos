{% extends 'base.html' %}
{% block title %}Editar paciente | Turnos Médicos{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">GESTIÓN DE DATOS</p><h1>Editar paciente</h1><p class="muted">Actualizá la información del paciente seleccionado.</p></div><a class="btn btn-secondary" href="{{ url_for('patients') }}">Volver</a></div>
<section class="panel narrow-panel"><form method="post" class="form-grid">
<label>DNI *<input name="dni" value="{{ patient.dni }}" required maxlength="15"></label>
<label>Nombre *<input name="first_name" value="{{ patient.first_name }}" required maxlength="50"></label>
<label>Apellido *<input name="last_name" value="{{ patient.last_name }}" required maxlength="50"></label>
<label>Teléfono *<input name="phone" value="{{ patient.phone }}" required maxlength="20"></label>
<label class="span-2">Correo electrónico<input name="email" type="email" value="{{ patient.email or '' }}" maxlength="100"></label>
<div class="span-2"><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
</form></section>
{% endblock %}
